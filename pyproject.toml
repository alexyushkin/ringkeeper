[project]
name = "interlock"
version = "0.1.0"
description = "Self-hosted orchestrator that binds each project to its own service instances."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Interlock contributors" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0.30",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.scripts]
interlock = "interlock.cli.main:app"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pre-commit>=3.7",
    "pyright>=1.1.380",
    "pytest>=8.3",
    "ruff>=0.17",
    "testcontainers[postgres]>=4.8",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "PT", "RUF", "S", "TID", "PL",
]
ignore = [
    "PLR0913", # CLI commands naturally take many options
    "PLR2004", # magic values are fine in tests and status codes
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR0915"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# A silently skipped flush (e.g. an object never added) must fail loudly.
filterwarnings = ["error::sqlalchemy.exc.SAWarning"]
