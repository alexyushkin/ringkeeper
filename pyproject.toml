[project]
name = "ringkeeper"
version = "0.1.0"
description = "Self-hosted orchestrator that binds each project to its own service instances."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Ringkeeper contributors" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "alembic>=1.13",
    "anthropic>=1.12.1,<1.13",
    "argon2-cffi>=25.1.0",
    "boto3>=1.43.118",
    "claude-agent-sdk==0.2.174",
    "cryptography>=50.0.2",
    "docker>=7.2.0",
    "fastapi>=0.115",
    "fastmcp>=4.1.3",
    "httpx2>=2.16.0",
    "keyring>=25",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyjwt>=2.15.1",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0.30",
    "typer>=0.12",
    "uvicorn>=0.30",
    "webauthn>=3.0.1,<3.1",
]

[project.optional-dependencies]
# Voice in the desktop app: the same engine as the stt service (stt/Dockerfile),
# run in-process. The model itself is downloaded on first use.
# Its newest transitive releases were under two weeks old: these are held back.
voice = [
    "faster-whisper==1.2.1",
    "av==18.1.0",
    "ctranslate2==4.8.2",
    "huggingface-hub==2.2.0",
    "onnxruntime==1.31.0",
]

[project.scripts]
ringkeeper = "ringkeeper.cli.main:app"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "moto[secretsmanager]>=5.2.4",
    "pre-commit>=3.7",
    "pyright>=1.1.380",
    "pytest>=8.3",
    "ruff>=0.17",
    "testcontainers[postgres]>=4.8",
    "types-boto3[secretsmanager]>=1.43.118",
    "types-docker>=7.2.0.20261006",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "worker", "stt"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "PT", "RUF", "S", "TID", "PL",
]
ignore = [
    "PLR0913", # CLI commands naturally take many options
    "PLR0917", # ...and Typer options are positional parameters
    "PLR2004", # magic values are fine in tests and status codes
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR0911", "PLR0912", "PLR0915"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pyright]
include = ["src", "tests", "worker", "stt"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
extraPaths = ["src", "worker", "stt"]
# The worker only ever runs in its Linux container.
executionEnvironments = [{ root = "worker", pythonPlatform = "Linux", extraPaths = ["worker"] }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["worker", "stt"]
addopts = "-ra --strict-markers"
markers = [
    "container: starts real worker or stt containers (needs Docker)",
    "postgres_only: about Ringkeeper's own database being Postgres (skipped with RINGKEEPER_TEST_DB=sqlite)",
]
# A silently skipped flush (e.g. an object never added) must fail loudly.
filterwarnings = ["error::sqlalchemy.exc.SAWarning"]
