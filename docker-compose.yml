name: ringkeeper

# Local stack: Postgres 16, the api (with the session manager) and the MCP gateway.
# Defaults work without a .env; copy .env.example to .env to change them.
# Ports are published on 127.0.0.1 only.
#
#   docker compose --profile worker build worker  # the worker image, once
#   docker compose up -d --build                  # postgres, api, gateway, web app
#   docker compose --profile demo up -d --build   # plus fake client databases
#   docker compose --profile stt up -d --build    # plus speech to text for voice notes
#
# Networks: `internal` holds Postgres, the api and the demo databases.
# `workers` holds only the gateway; worker containers join it and nothing else,
# so they can reach the gateway but not Postgres or the api.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ringkeeper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ringkeeper}
      POSTGRES_DB: ${POSTGRES_DB:-ringkeeper}
    ports:
      - "127.0.0.1:${RINGKEEPER_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    # The session manager starts workers through the Docker socket. Access to
    # that socket is root on the host, so this service is root-equivalent on
    # the host: it is the only one that gets the socket.
    user: "0:0"
    environment:
      RINGKEEPER_DATABASE_URL: >-
        postgresql+psycopg://${POSTGRES_USER:-ringkeeper}:${POSTGRES_PASSWORD:-ringkeeper}@postgres:5432/${POSTGRES_DB:-ringkeeper}
      RINGKEEPER_SESSION_MANAGER: "1"
      RINGKEEPER_DATA_DIR: /var/lib/ringkeeper
      RINGKEEPER_MASTER_KEY: ${RINGKEEPER_MASTER_KEY:-}
      RINGKEEPER_CLAUDE_AUTH_MODE: ${RINGKEEPER_CLAUDE_AUTH_MODE:-api_key}
      RINGKEEPER_WORKSPACES_ROOT: ${RINGKEEPER_WORKSPACES_ROOT:-}
      RINGKEEPER_MAX_CONCURRENT_WORKERS: ${RINGKEEPER_MAX_CONCURRENT_WORKERS:-4}
      # Must match the `workers` network's name below (a second install on the
      # same machine needs its own).
      RINGKEEPER_WORKER_NETWORK: ${RINGKEEPER_WORKER_NETWORK:-ringkeeper_workers}
      # The router turns `ringkeeper ask` / POST /messages into tasks.
      RINGKEEPER_ROUTER: ${RINGKEEPER_ROUTER:-1}
      RINGKEEPER_ROUTER_CONFIDENCE_THRESHOLD: ${RINGKEEPER_ROUTER_CONFIDENCE_THRESHOLD:-0.8}
      RINGKEEPER_MODEL_ROUTER: ${RINGKEEPER_MODEL_ROUTER:-claude-haiku-5-5}
      RINGKEEPER_MODEL_ARCHITECT: ${RINGKEEPER_MODEL_ARCHITECT:-claude-opus-5-5}
      RINGKEEPER_MODEL_WORKER: ${RINGKEEPER_MODEL_WORKER:-claude-sonnet-5-5}
      RINGKEEPER_MODEL_LOW: ${RINGKEEPER_MODEL_LOW:-claude-haiku-5-5}
      RINGKEEPER_MODEL_MEDIUM: ${RINGKEEPER_MODEL_MEDIUM:-claude-sonnet-5-5}
      RINGKEEPER_MODEL_HIGH: ${RINGKEEPER_MODEL_HIGH:-claude-opus-5-5}
      # Telegram notifications (off until you've run `ringkeeper telegram login`).
      RINGKEEPER_TELEGRAM: ${RINGKEEPER_TELEGRAM:-0}
      RINGKEEPER_TELEGRAM_CHAT_IDS: ${RINGKEEPER_TELEGRAM_CHAT_IDS:-[]}
      RINGKEEPER_TELEGRAM_SUMMARY_CHARS: ${RINGKEEPER_TELEGRAM_SUMMARY_CHARS:-160}
      RINGKEEPER_TELEGRAM_QUESTION_CHARS: ${RINGKEEPER_TELEGRAM_QUESTION_CHARS:-1000}
      # New requests from Telegram: off unless you opt in (see the README).
      RINGKEEPER_TELEGRAM_REQUESTS: ${RINGKEEPER_TELEGRAM_REQUESTS:-0}
      RINGKEEPER_TELEGRAM_CONFIRM_MINUTES: ${RINGKEEPER_TELEGRAM_CONFIRM_MINUTES:-10}
      # Voice notes go to the optional stt service (`--profile stt`).
      RINGKEEPER_STT_URL: ${RINGKEEPER_STT_URL:-http://stt:9000}
      RINGKEEPER_STT_MAX_SECONDS: ${RINGKEEPER_STT_MAX_SECONDS:-180}
      RINGKEEPER_STT_MAX_BYTES: ${RINGKEEPER_STT_MAX_BYTES:-5000000}
      # Full transcripts are deleted after this many days (summaries and the audit stay).
      RINGKEEPER_RETENTION_DAYS: ${RINGKEEPER_RETENTION_DAYS:-90}
      # The web app (M5). Files the api writes in the data dir go to the gateway's
      # user (10001), the admin token's copy for the web app to the web's (10003).
      RINGKEEPER_DATA_UID: "10001"
      RINGKEEPER_WEB_TOKEN_FILE: /run/ringkeeper-web/api-token
      RINGKEEPER_WEB_UID: "10003"
      # The web app's HTTPS address (Tailscale Serve, say); passkeys need it.
      RINGKEEPER_WEB_ORIGIN: ${RINGKEEPER_WEB_ORIGIN:-}
    volumes:
      # Writable: on first start the api creates the master key, the admin token
      # and the setup code here, and the web app's wizard stores secrets.
      - ./.ringkeeper:/var/lib/ringkeeper
      # Only the api (writes) and web (reads) mount this: the admin token's copy.
      - web-token:/run/ringkeeper-web
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:${RINGKEEPER_API_PORT:-8000}:8000"
    networks: [internal, frontend]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    build: .
    command:
      ["uvicorn", "ringkeeper.gateway.app:create_app", "--factory",
       "--host", "0.0.0.0", "--port", "8100"]
    environment:
      RINGKEEPER_DATABASE_URL: >-
        postgresql+psycopg://${POSTGRES_USER:-ringkeeper}:${POSTGRES_PASSWORD:-ringkeeper}@postgres:5432/${POSTGRES_DB:-ringkeeper}
      RINGKEEPER_DATA_DIR: /var/lib/ringkeeper
      RINGKEEPER_MASTER_KEY: ${RINGKEEPER_MASTER_KEY:-}
    # The vault and master.key, shared with the host CLI. Read-only: the gateway
    # never writes secrets. Workers must never get this directory.
    volumes:
      - ./.ringkeeper:/var/lib/ringkeeper:ro
    ports:
      - "127.0.0.1:${RINGKEEPER_GATEWAY_PORT:-8100}:8100"
    networks: [internal, workers]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(urllib.request.urlopen('http://127.0.0.1:8100/health').status != 200)"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      api:
        condition: service_healthy  # the api applies migrations before it is healthy
    restart: unless-stopped

  # The web app (Next.js). Only on `frontend` with the api: it can't reach
  # Postgres, the gateway or workers. It never mounts the vault or the data dir;
  # the api hands it the admin token through the web-token volume. For your
  # phone, put it behind HTTPS (Tailscale Serve: see the README).
  web:
    build: ./web
    image: ringkeeper-web:latest
    environment:
      RINGKEEPER_API_URL: http://api:8000
      RINGKEEPER_API_TOKEN_FILE: /run/ringkeeper-web/api-token
      # Trust X-Forwarded-For (for sign-in rate limits) only behind your own proxy.
      RINGKEEPER_WEB_TRUST_PROXY: ${RINGKEEPER_WEB_TRUST_PROXY:-0}
      # Its HTTPS address, if any: sign-in cookies there are always Secure.
      RINGKEEPER_WEB_ORIGIN: ${RINGKEEPER_WEB_ORIGIN:-}
    volumes:
      - web-token:/run/ringkeeper-web:ro
    ports:
      - "127.0.0.1:${RINGKEEPER_WEB_PORT:-3000}:3000"
    networks: [frontend]
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Build-only: the image the session manager starts workers from.
  worker:
    profiles: [worker]
    build: ./worker
    image: ringkeeper-worker:latest

  # Optional: speech to text for Telegram voice notes (faster-whisper, CPU, int8).
  #   docker compose --profile stt up -d --build
  # No published port: only the api reaches it, on `internal`. The first start
  # downloads the model into the stt-models volume; then RINGKEEPER_STT_OFFLINE=1
  # keeps it from going online at all.
  stt:
    profiles: [stt]
    build: ./stt
    image: ringkeeper-stt:latest
    environment:
      RINGKEEPER_STT_MODEL: ${RINGKEEPER_STT_MODEL:-small}
      RINGKEEPER_STT_LANGUAGE: ${RINGKEEPER_STT_LANGUAGE:-}
      RINGKEEPER_STT_MAX_SECONDS: ${RINGKEEPER_STT_MAX_SECONDS:-180}
      RINGKEEPER_STT_MAX_BYTES: ${RINGKEEPER_STT_MAX_BYTES:-5000000}
      HF_HUB_OFFLINE: ${RINGKEEPER_STT_OFFLINE:-0}
    volumes:
      - stt-models:/models
    networks: [internal]
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  # Demo only: three fictional clients' "Supabase" databases (plain Postgres).
  demo-targets:
    profiles: [demo]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo-local-only
      POSTGRES_DB: demo
    ports:
      - "127.0.0.1:${RINGKEEPER_DEMO_DB_PORT:-5433}:5432"
    volumes:
      - ./docker/demo-targets/init.sql:/docker-entrypoint-initdb.d/10-demo.sql:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 2s
      timeout: 3s
      retries: 30

networks:
  internal: {}
  # The web app and the api, nothing else.
  frontend: {}
  workers:
    # A known name (RINGKEEPER_WORKER_NETWORK): the session manager attaches workers to it.
    name: ${RINGKEEPER_WORKER_NETWORK:-ringkeeper_workers}

volumes:
  pgdata:
  stt-models:
  web-token:
