[package]
name = "ringkeeper-shell"
version = "0.1.0"
description = "Ringkeeper's desktop app: the window, the tray, and the local backend it runs"
license = "MIT"
edition = "2021"
publish = false

[[bin]]
name = "ringkeeper"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "=2.8.1"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "=2.13.3"
ureq = { version = "3", default-features = false, features = ["json"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
