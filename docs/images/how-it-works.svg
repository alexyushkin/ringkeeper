<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="hiw-title" font-family="Segoe UI, -apple-system, Roboto, Helvetica, Arial, sans-serif"><style>svg{--color-bg:#f1f0ec;--color-surface:#ffffff;--color-sunken:#e8e6e0;--color-line:#c9c6bf;--color-ink:#1b1b19;--color-muted:#5f5e59;--color-accent:#2f5bd3;--color-accent-ink:#ffffff;--color-good:#1c7247;--color-warn:#9a5400;--color-accent-soft:#e9efff;--color-good-soft:#e7f5ee;--color-warn-soft:#fff3e0;}@media (prefers-color-scheme: dark){svg{--color-bg:#121211;--color-surface:#1c1c1a;--color-sunken:#171716;--color-line:#2e2d2a;--color-ink:#ecebe7;--color-muted:#a09e98;--color-accent:#7b9cff;--color-accent-ink:#0d1530;--color-good:#5fcf96;--color-warn:#f0a94a;--color-accent-soft:#1e2744;--color-good-soft:#17301f;--color-warn-soft:#3a2a12;}}</style><title id="hiw-title">How a request flows. You ask in plain words. Ringkeeper finds the right client project. Claude does the work with only that project's connections. Reads and test data run straight through; a change to live data or a message to real people waits for your OK. Then it reports back, and most data changes can be undone for 7 days. Agents and routines are an optional way to start the same work without asking. Each client's connections are kept apart, and the AI never sees a key.</title><defs><marker id="hiw-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0.8L9 5L0 9.2z" fill="var(--color-accent)"/></marker><marker id="hiw-head-warn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0.8L9 5L0 9.2z" fill="var(--color-warn)"/></marker><marker id="hiw-head-good" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0.8L9 5L0 9.2z" fill="var(--color-good)"/></marker><linearGradient id="hiw-page" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--color-bg)"/><stop offset="1" stop-color="var(--color-bg)"/></linearGradient><filter id="hiw-lift" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.07"/></filter></defs><rect width="1200" height="650" rx="24" fill="var(--color-bg)"/><text x="48" y="62" font-size="28" font-weight="700" fill="var(--color-ink)" text-anchor="start">You ask. Ringkeeper does the work. You stay in charge.</text><text x="48" y="92" font-size="15" font-weight="400" fill="var(--color-muted)" text-anchor="start">Connect each client's tools once, then just say what you need.</text><path d="M248 263.0 H268" fill="none" stroke="var(--color-accent)" stroke-width="2.25" stroke-linecap="round" marker-end="url(#hiw-head)"/><path d="M475 263.0 H495" fill="none" stroke="var(--color-accent)" stroke-width="2.25" stroke-linecap="round" marker-end="url(#hiw-head)"/><path d="M702 263.0 H722" fill="none" stroke="var(--color-warn)" stroke-width="2.25" stroke-linecap="round" marker-end="url(#hiw-head-warn)"/><path d="M929 263.0 H949" fill="none" stroke="var(--color-good)" stroke-width="2.25" stroke-linecap="round" marker-end="url(#hiw-head-good)"/><path d="M600.0 144 V136 Q600.0 122 614.0 122 H1040.0 Q1054.0 122 1054.0 136 V141" fill="none" stroke="var(--color-good)" stroke-width="2.25" stroke-linecap="round" marker-end="url(#hiw-head-good)"/><rect x="682.0" y="111" width="290" height="22" fill="url(#hiw-page)"/><text x="827.0" y="127" font-size="13" font-weight="600" fill="var(--color-good)" text-anchor="middle">Reading, and test data, go straight through</text><rect x="48" y="150" width="196" height="226" rx="18" fill="var(--color-surface)" stroke="var(--color-line)" stroke-width="1.5" filter="url(#hiw-lift)"/><rect x="64" y="166" width="38" height="38" rx="11" fill="var(--color-accent-soft)"/><path transform="translate(71 173)" d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" fill="none" stroke="var(--color-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="228" y="191" font-size="13" font-weight="600" fill="var(--color-muted)" text-anchor="end">1</text><text x="64" y="229" font-size="16" font-weight="700" fill="var(--color-ink)" text-anchor="start">You ask</text><rect x="64" y="244" width="164" height="62" rx="14" fill="var(--color-accent)"/><text x="76" y="265" font-size="12.5" font-weight="500" fill="var(--color-accent-ink)" text-anchor="start">Add last week's</text><text x="76" y="282" font-size="12.5" font-weight="500" fill="var(--color-accent-ink)" text-anchor="start">leads to General</text><text x="76" y="299" font-size="12.5" font-weight="500" fill="var(--color-accent-ink)" text-anchor="start">Informatics' Airtable</text><text x="64" y="330" font-size="13" font-weight="400" fill="var(--color-muted)" text-anchor="start">Typed or spoken, in the</text><text x="64" y="348" font-size="13" font-weight="400" fill="var(--color-muted)" text-anchor="start">app or on Telegram</text><rect x="275" y="150" width="196" height="226" rx="18" fill="var(--color-surface)" stroke="var(--color-line)" stroke-width="1.5" filter="url(#hiw-lift)"/><rect x="291" y="166" width="38" height="38" rx="11" fill="var(--color-accent-soft)"/><path transform="translate(298 173)" d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" fill="none" stroke="var(--color-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="455" y="191" font-size="13" font-weight="600" fill="var(--color-muted)" text-anchor="end">2</text><text x="291" y="229" font-size="16" font-weight="700" fill="var(--color-ink)" text-anchor="start">It finds the project</text><rect x="291" y="246" width="150" height="25" rx="12.5" fill="var(--color-accent-soft)"/><text x="300" y="263" font-size="12" font-weight="600" fill="var(--color-accent)" text-anchor="start">geninfos.com website</text><text x="291" y="296" font-size="13" font-weight="400" fill="var(--color-muted)" text-anchor="start">From what you said. If it</text><text x="291" y="314" font-size="13" font-weight="400" fill="var(--color-muted)" text-anchor="start">isn't sure, it asks you</text><text x="291" y="332" font-size="13" font-weight="400" fill="var(--color-muted)" text-anchor="start">first.</text><rect x="502" y="150" width="196" height="226" rx="18" fill="var(--color-surface)" stroke="var(--color-line)" stroke-width="1.5" filter="url(#hiw-lift)"/><rect x="518" y="166" width="38" height="38" rx="11" fill="var(--color-accent-soft)"/><path transform="translate(525 173)" d="M12 3l1.9 5.6 5.6 1.9-5.6 1.9L12 18l-1.9-5.6-5.6-1.9 5.6-1.9z" fill="none" stroke="var(--color-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="682" y="191" font-size="13" font-weight="600" fill="var(--color-muted)" text-anchor="end">3</text><text x="518" y="229" font-size="16" font-weight="700" fill="var(--color-ink)" text-anchor="start">Claude does the work</text><rect x="518" y="246" width="70" height="25" rx="12.5" fill="var(--color-accent-soft)"/><text x="527" y="263" font-size="12" font-weight="600" fill="var(--color-accent)" text-anchor="start">Airtable</text><rect x="593.6" y="246" width="36" height="25" rx="12.5" fill="var(--color-accent-soft)"/><text x="602.6" y="263" font-size="12" font-weight="600" fill="var(--color-accent)" text-anchor="start">n8n</text><text x="518" y="296" font-size="13" font-weight="400" fill="var(--color-muted)" text-anchor="start">In that project's folder,</text><text x="518" y="314" font-size="13" font-weight="400" fill="var(--color-muted)" text-anchor="start">with only that project's</text><text x="518" y="332" font-size="13" font-weight="400" fill="var(--color-muted)" text-anchor="start">connections.</text><rect x="729" y="150" width="196" height="226" rx="18" fill="var(--color-surface)" stroke="var(--color-warn)" stroke-width="2" filter="url(#hiw-lift)"/><rect x="745" y="166" width="38" height="38" rx="11" fill="var(--color-warn-soft)"/><path transform="translate(752 173)" d="M12 3l8 3v6c0 5-3.4 8-8 9-4.6-1-8-4-8-9V6z" fill="none" stroke="var(--color-warn)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="909" y="191" font-size="13" font-weight="600" fill="var(--color-muted)" text-anchor="end">4</text><text x="745" y="229" font-size="16" font-weight="700" fill="var(--color-ink)" text-anchor="start">Live changes wait</text><rect x="745" y="246" width="82" height="28" rx="9" fill="var(--color-good)"/><text x="786" y="265" font-size="12.5" font-weight="700" fill="var(--color-surface)" text-anchor="middle">Approve</text><rect x="835" y="246" width="64" height="28" rx="9" fill="none" stroke="var(--color-muted)"/><text x="867" y="265" font-size="12.5" font-weight="600" fill="var(--color-ink)" text-anchor="middle">Deny</text><text x="745" y="296" font-size="13" font-weight="400" fill="var(--color-muted)" text-anchor="start">Production data and</text><text x="745" y="314" font-size="13" font-weight="400" fill="var(--color-muted)" text-anchor="start">messages to real people</text><text x="745" y="332" font-size="13" font-weight="400" fill="var(--color-muted)" text-anchor="start">need your OK.</text><rect x="956" y="150" width="196" height="226" rx="18" fill="var(--color-surface)" stroke="var(--color-good)" stroke-width="2" filter="url(#hiw-lift)"/><rect x="972" y="166" width="38" height="38" rx="11" fill="var(--color-good-soft)"/><path transform="translate(979 173)" d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="var(--color-good)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="1136" y="191" font-size="13" font-weight="600" fill="var(--color-muted)" text-anchor="end">5</text><text x="972" y="229" font-size="16" font-weight="700" fill="var(--color-ink)" text-anchor="start">Done, and logged</text><rect x="972" y="246" width="116" height="25" rx="12.5" fill="var(--color-good-soft)"/><text x="981" y="263" font-size="12" font-weight="600" fill="var(--color-good)" text-anchor="start">Undo for 7 days</text><text x="972" y="296" font-size="13" font-weight="400" fill="var(--color-muted)" text-anchor="start">Reported in your chat.</text><text x="972" y="314" font-size="13" font-weight="400" fill="var(--color-muted)" text-anchor="start">Undo covers databases,</text><text x="972" y="332" font-size="13" font-weight="400" fill="var(--color-muted)" text-anchor="start">Airtable and n8n.</text><rect x="48" y="416" width="600" height="190" rx="18" fill="none" stroke="var(--color-muted)" stroke-width="1.5" stroke-dasharray="7 7"/><text x="72" y="450" font-size="16" font-weight="700" fill="var(--color-ink)" text-anchor="start">Optional: work that starts itself</text><text x="72" y="472" font-size="13" font-weight="400" fill="var(--color-muted)" text-anchor="start">You don't need these. Asking is enough.</text><rect x="72" y="488" width="272" height="94" rx="18" fill="var(--color-surface)" stroke="var(--color-line)" stroke-width="1.5" filter="url(#hiw-lift)"/><rect x="86" y="502" width="38" height="38" rx="11" fill="var(--color-accent-soft)"/><path transform="translate(93 509)" d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7v5l3.5 2" fill="none" stroke="var(--color-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="134" y="519" font-size="14" font-weight="700" fill="var(--color-ink)" text-anchor="start">Routine: when</text><text x="134" y="539" font-size="12.5" font-weight="400" fill="var(--color-muted)" text-anchor="start">On a schedule, on an event, or</text><text x="134" y="555" font-size="12.5" font-weight="400" fill="var(--color-muted)" text-anchor="start">when you press Run</text><rect x="388" y="488" width="236" height="94" rx="18" fill="var(--color-surface)" stroke="var(--color-line)" stroke-width="1.5" filter="url(#hiw-lift)"/><rect x="402" y="502" width="38" height="38" rx="11" fill="var(--color-accent-soft)"/><path transform="translate(409 509)" d="M12 3l1.9 5.6 5.6 1.9-5.6 1.9L12 18l-1.9-5.6-5.6-1.9 5.6-1.9z" fill="none" stroke="var(--color-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="450" y="519" font-size="14" font-weight="700" fill="var(--color-ink)" text-anchor="start">Agent: who</text><text x="450" y="539" font-size="12.5" font-weight="400" fill="var(--color-muted)" text-anchor="start">A saved helper with its</text><text x="450" y="555" font-size="12.5" font-weight="400" fill="var(--color-muted)" text-anchor="start">own instructions</text><path d="M348 535 H382" fill="none" stroke="var(--color-accent)" stroke-width="2.25" stroke-linecap="round" marker-end="url(#hiw-head)"/><path d="M600.0 484 V383" fill="none" stroke="var(--color-accent)" stroke-width="2.25" stroke-linecap="round" stroke-dasharray="6 6" marker-end="url(#hiw-head)"/><rect x="672" y="416" width="480" height="190" rx="18" fill="var(--color-surface)" stroke="var(--color-line)" stroke-width="1.5" filter="url(#hiw-lift)"/><rect x="692" y="432" width="38" height="38" rx="11" fill="var(--color-good-soft)"/><path transform="translate(699 439)" d="M6 11h12a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1zM8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="var(--color-good)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="742" y="450" font-size="16" font-weight="700" fill="var(--color-ink)" text-anchor="start">Every client kept apart</text><text x="742" y="470" font-size="12.5" font-weight="400" fill="var(--color-muted)" text-anchor="start">One client's project can't reach another's connections.</text><rect x="692" y="488" width="210" height="50" rx="12" fill="var(--color-sunken)"/><text x="706" y="509" font-size="13" font-weight="700" fill="var(--color-ink)" text-anchor="start">General Informatics LLC</text><text x="706" y="527" font-size="12" font-weight="400" fill="var(--color-muted)" text-anchor="start">Its projects and connections</text><rect x="922" y="488" width="210" height="50" rx="12" fill="var(--color-sunken)"/><text x="936" y="509" font-size="13" font-weight="700" fill="var(--color-ink)" text-anchor="start">Another client</text><text x="936" y="527" font-size="12" font-weight="400" fill="var(--color-muted)" text-anchor="start">Its projects and connections</text><path d="M912 484 V542" stroke="var(--color-warn)" stroke-width="2.5" stroke-linecap="round"/><text x="692" y="566" font-size="13" font-weight="600" fill="var(--color-ink)" text-anchor="start">Ringkeeper adds each key itself. The AI never sees one.</text><text x="692" y="586" font-size="12.5" font-weight="400" fill="var(--color-muted)" text-anchor="start">Your own tools, like a browser, can go to any project.</text></svg>
