<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 298" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="A client has projects. A project uses the client's connections and your shared tools. An agent works in a project and a routine runs it. A change to live data is held until you approve it.">
  <rect width="640" height="298" fill="#f7f7f5"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b6a65"/></marker></defs>
  <rect x="10" y="14" width="180" height="52" rx="10" fill="#ffffff" stroke="#d6d3cc" stroke-width="1.5"/>
  <text x="22" y="35" font-size="13" font-weight="600" fill="#1b1b19">Client</text>
  <text x="22" y="54" font-size="11.5" fill="#6b6a65">Acme Inc.</text>
  <rect x="10" y="104" width="180" height="52" rx="10" fill="#ffffff" stroke="#2f5bd3" stroke-width="1.5"/>
  <text x="22" y="125" font-size="13" font-weight="600" fill="#1b1b19">Project</text>
  <text x="22" y="144" font-size="11.5" fill="#6b6a65">Acme website</text>
  <rect x="250" y="60" width="180" height="52" rx="10" fill="#ffffff" stroke="#d6d3cc" stroke-width="1.5"/>
  <text x="262" y="81" font-size="13" font-weight="600" fill="#1b1b19">Connections</text>
  <text x="262" y="100" font-size="11.5" fill="#6b6a65">Acme's database, Airtable</text>
  <rect x="450" y="60" width="180" height="52" rx="10" fill="#ffffff" stroke="#d6d3cc" stroke-width="1.5"/>
  <text x="462" y="81" font-size="13" font-weight="600" fill="#1b1b19">Shared tools</text>
  <text x="462" y="100" font-size="11.5" fill="#6b6a65">your browser, your files</text>
  <rect x="10" y="200" width="180" height="52" rx="10" fill="#ffffff" stroke="#d6d3cc" stroke-width="1.5"/>
  <text x="22" y="221" font-size="13" font-weight="600" fill="#1b1b19">Agent</text>
  <text x="22" y="240" font-size="11.5" fill="#6b6a65">follow-up: who does it</text>
  <rect x="250" y="200" width="180" height="52" rx="10" fill="#ffffff" stroke="#d6d3cc" stroke-width="1.5"/>
  <text x="262" y="221" font-size="13" font-weight="600" fill="#1b1b19">Routine</text>
  <text x="262" y="240" font-size="11.5" fill="#6b6a65">weekdays at 9: when</text>
  <rect x="450" y="200" width="180" height="52" rx="10" fill="#ffffff" stroke="#a35a00" stroke-width="1.5"/>
  <text x="462" y="221" font-size="13" font-weight="600" fill="#1b1b19">Hold</text>
  <text x="462" y="240" font-size="11.5" fill="#6b6a65">waits for your OK</text>
  <path d="M100 66 V100" fill="none" stroke="#6b6a65" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="108" y="88" font-size="11" fill="#6b6a65">has</text>
  <path d="M190 124 C220 124 220 86 246 86" fill="none" stroke="#6b6a65" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="200" y="104" font-size="11" fill="#6b6a65">uses</text>
  <path d="M190 136 C330 160 470 150 534 116" fill="none" stroke="#6b6a65" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M100 156 V196" fill="none" stroke="#6b6a65" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="108" y="182" font-size="11" fill="#6b6a65">has</text>
  <path d="M250 226 H194" fill="none" stroke="#6b6a65" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="204" y="220" font-size="11" fill="#6b6a65">runs</text>
  <path d="M100 252 V264 Q100 274 110 274 H530 Q540 274 540 264 V256" fill="none" stroke="#6b6a65" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="268" y="290" font-size="11" fill="#6b6a65">a change to live data</text>
</svg>
