# gitleaks: its default rules, plus the made-up values the tests use, which look
# like API keys but aren't. Allow only exact fakes here, never a pattern a real
# secret could match.
[extend]
useDefault = true

[[allowlists]]
description = "Fake values in the tests"
condition = "AND"  # in tests/ AND one of these exact values
paths = ['''^tests/''']
regexes = [
  '''^wrkspc_01AbC$''',  # a made-up Anthropic workspace ID
  '''^--api-key=abc123$''',  # a fake CLI argument
  '''^xapp-1-A111-2222-fakeapptokenvalue$''',  # the fake Slack app token (fake_chat)
  '''^n8n-key-1234567890$''',  # the fake n8n key in a project's .env (test_conveniences)
  '''^fof-key-123456$''',  # a fake Forms On Fire key in a .env (test_detection)
  '''^sk_live_fake123456$''',  # a fake Stripe key in a .env (test_detection)
  '''^sk_live_clerkfake123456$''',  # a fake Clerk key (test_vendors)
  '''^sk_test_clerkfake123456$''',  # a fake Clerk key (test_vendors)
]
