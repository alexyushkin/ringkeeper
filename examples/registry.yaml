# Example registry for two fictional clients, Acme and Globex.
# Apply with:  uv run interlock registry apply examples/registry.yaml [--dry-run]
#
# secret_ref values are pointers (file:// or aws-sm://), never credentials.
# Store the values themselves with `interlock secret set <ref>`.
# All hosts use reserved .example domains. Tool names are the gateway's own
# (see `interlock` README: Gateway); prod writes not listed in
# preapproved_writes are held for a human.

version: 1

instances:
  # Acme: three Supabase projects and one n8n host
  - name: acme-supabase-dev
    type: supabase
    env: dev
    base_url: https://acme-dev.supabase.example
    secret_ref: file://acme/supabase-dev
    owner: acme-platform
  - name: acme-supabase-staging
    type: supabase
    env: staging
    base_url: https://acme-staging.supabase.example
    secret_ref: aws-sm://interlock/acme/supabase-staging
    owner: acme-platform
  - name: acme-supabase-prod
    type: supabase
    env: prod
    base_url: https://acme-prod.supabase.example
    secret_ref: file://acme/supabase-prod
    owner: acme-platform
  - name: acme-n8n
    type: n8n
    env: prod
    base_url: https://n8n.acme.example
    secret_ref: aws-sm://interlock/acme/n8n
    owner: acme-ops

  # Globex: one Supabase project, its own n8n host, and a Vercel team
  - name: globex-supabase-dev
    type: supabase
    env: dev
    base_url: https://globex-dev.supabase.example
    secret_ref: file://globex/supabase-dev
    owner: globex-web
  - name: globex-n8n-staging
    type: n8n
    env: staging
    base_url: https://n8n-staging.globex.example
    secret_ref: aws-sm://interlock/globex/n8n-staging
    owner: globex-web
  - name: globex-vercel
    type: vercel
    env: staging
    secret_ref: aws-sm://interlock/globex/vercel
    owner: globex-web

projects:
  - name: acme-web
    owner: acme-platform
    description: Acme customer portal
    aliases: [acme, acme-portal]
    repo_url: https://git.example/acme/web
    workspace_path: /srv/interlock/workspaces/acme-web
    autonomy: standard
    bindings:
      - instance: acme-supabase-dev
        default: true
      - instance: acme-supabase-staging
        allowed_tools: [list_tables, describe_table, query]
      # Prod is bound but never default: writes must name it explicitly, and
      # execute is held for approval because it isn't preapproved.
      - instance: acme-supabase-prod
        allowed_tools: [list_tables, describe_table, query, execute]
      # A prod n8n host can't be the default either. Switching a workflow off
      # is preapproved (an incident lever); every other write waits for a human.
      - instance: acme-n8n
        allowed_tools:
          [list_workflows, get_workflow, list_executions, get_execution,
           activate_workflow, deactivate_workflow, update_workflow]
        preapproved_writes: [deactivate_workflow]

  - name: acme-reports
    owner: acme-ops
    description: Internal reporting jobs
    aliases: [acme-bi]
    autonomy: strict
    bindings:
      - instance: acme-supabase-staging
        default: true
        allowed_tools: [list_tables, describe_table, query]

  - name: globex-portal
    owner: globex-web
    description: Globex partner portal
    aliases: [globex]
    repo_url: https://git.example/globex/portal
    autonomy: relaxed
    bindings:
      - instance: globex-supabase-dev
        default: true
      - instance: globex-n8n-staging
        default: true
      # No vercel adapter yet (M2 ships supabase and n8n); bound for later.
      - instance: globex-vercel
        default: true
