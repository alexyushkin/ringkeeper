name: timeout-proof
# Throwaway: never merged. The real pytest config against a test that never ends.
on: pull_request
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run pytest tests/test_hang_proof.py -v -p no:cacheprovider
        env:
          RINGKEEPER_TEST_DB: sqlite
