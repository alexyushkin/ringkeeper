name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pyright

  tests:
    # Ringkeeper's own database: Postgres (server mode) and SQLite (desktop
    # mode). Client databases for the Supabase connector are Postgres either way.
    name: tests (${{ matrix.python }}, ${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.12", db: postgres }
          - { python: "3.13", db: postgres }
          - { python: "3.12", db: sqlite }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      # testcontainers starts Postgres 16 on the runner's Docker.
      - run: uv run pytest
        env:
          RINGKEEPER_TEST_DB: ${{ matrix.db }}

  tests-windows:
    # The desktop app's main platform: SQLite, no Docker (Windows runners have
    # no Linux containers, so tests that need a Postgres or a worker image skip).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest -m "not container"
        env:
          RINGKEEPER_TEST_DB: sqlite
          RINGKEEPER_TEST_NO_DOCKER: "1"

  claude-cli-windows-no-bash:
    # The desktop app's usual machine: Windows without Git for Windows. Claude
    # Code then has no Git Bash and falls back to PowerShell; workers use MinGit
    # (git without bash), as the desktop bundle does. The real CLI runs against
    # a fake Anthropic API (tests/fake_anthropic.py): no key, no cost.
    runs-on: windows-latest
    env:
      MINGIT_URL: https://github.com/git-for-windows/git/releases/download/v2.56.0.windows.2/MinGit-2.56.0.2-64-bit.zip
      MINGIT_SHA256: da35e72aa21c005a5a0d298cfbae110bc1609a815730ea0dde84b01a1b3cd3be
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked
      - name: MinGit instead of Git for Windows, and no bash anywhere
        shell: pwsh
        run: |
          Invoke-WebRequest $env:MINGIT_URL -OutFile mingit.zip
          if ((Get-FileHash mingit.zip -Algorithm SHA256).Hash -ne $env:MINGIT_SHA256) { throw "MinGit checksum mismatch" }
          Expand-Archive mingit.zip -DestinationPath C:\mingit
          if (Get-ChildItem C:\mingit -Recurse -Filter bash.exe) { throw "this MinGit has a bash" }
          foreach ($dir in "C:\Program Files\Git", "C:\msys64", "C:\cygwin64") {
            if (Test-Path $dir) { Rename-Item $dir ((Split-Path $dir -Leaf) + "-hidden") }
          }
          $bash = Get-Command bash -ErrorAction SilentlyContinue
          if ($bash) { Write-Output "note: a bash is still on PATH: $($bash.Source)" }
          'RINGKEEPER_WORKER_TOOLS_PATH=["C:\\mingit\\cmd"]' >> $env:GITHUB_ENV
      - run: uv run pytest tests/test_claude_cli.py -p no:cacheprovider
        env:
          RINGKEEPER_TEST_DB: sqlite
          RINGKEEPER_TEST_NO_DOCKER: "1"
          RINGKEEPER_EXPECT_SHELL: PowerShell

  desktop-shell:
    # The app shell (shell/, Tauri): lint, unit tests, then the real thing
    # with the real backend: crash restart, reattach after a shell crash, and
    # a Quit that leaves nothing running. No installer here: that's on tags.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked
      - name: Rust (stable, with clippy and rustfmt)
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            shell/target
          key: shell-${{ runner.os }}-${{ hashFiles('shell/Cargo.lock') }}
      - run: cargo fmt --check
        working-directory: shell
      - run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: shell
      - run: cargo test --locked
        working-directory: shell
      - run: cargo build --locked
        working-directory: shell
      - run: uv run pytest tests/test_desktop_shell.py -p no:cacheprovider
        env:
          RINGKEEPER_TEST_DB: sqlite
          RINGKEEPER_SHELL_EXE: ${{ github.workspace }}\shell\target\debug\ringkeeper.exe

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the full history, not just the last commit
      - name: Install gitleaks (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/${tarball}"
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          grep " ${tarball}\$" checksums.txt | sha256sum --check --strict
          tar -xzf "${tarball}" gitleaks
      - run: ./gitleaks git --redact --verbose .

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-fund
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      # The desktop app's copy: the same app exported as static files.
      - run: node scripts/build-desktop.mjs

  e2e:
    # The whole stack in Docker (fresh each run) and Chromium with a fake
    # microphone playing tests/fixtures/voice-works.wav.
    runs-on: ubuntu-latest
    needs: [web]
    timeout-minutes: 45
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - if: failure()
        run: docker compose -p ringkeeper-e2e -f ../docker-compose.yml -f e2e/compose.e2e.yml --profile stt --profile demo logs --no-color > e2e-stack.log 2>&1 || true
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-report
          path: |
            web/playwright-report
            web/test-results
            web/e2e-stack.log
          retention-days: 7
